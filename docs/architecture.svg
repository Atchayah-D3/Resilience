<path d="M 1010 643 L 1042 643" stroke="#ab3a20" stroke-width="1.7"/>
<text x="1052" y="647" class="bd">to the machine</text>
<path d="M 1010 662 L 1042 662" stroke="#5a6b78" stroke-width="1.7" stroke-dasharray="4 3"/>
<text x="1052" y="666" class="bd">written to disk</text>
