<text x="1065.0" y="460" class="numt" text-anchor="middle">8</text>
<text x="50" y="604" class="band">THE EIGHT STEPS</text>
<text x="50" y="628" class="bd">1  catalog and envs are read and validated, then the run plan is built</text>
<text x="50" y="647" class="bd">2  the orchestrator runs the nine phases and refuses an unsafe target</text>
<text x="50" y="666" class="bd">3  injectors kill or restart, the workload commits markers, probes write</text>
<text x="50" y="685" class="bd">4  shell commands over SSH, SQL over the database protocol, answers back</text>
<text x="520" y="628" class="bd">5  the ledger is flushed to disk before the fault is applied, never after</text>
<text x="520" y="647" class="bd">6  marker journals, probe results and one-second samples are appended live</text>
<text x="520" y="666" class="bd">7  the decomposer and the marker sets read the record, not the live database</text>
<text x="520" y="685" class="bd">8  every accept rule is evaluated; passed also needs the machine left clean</text>
<text x="1010" y="604" class="band">LINES</text>
<path d="M 1010 624 L 1042 624" stroke="#5a6b78" stroke-width="1.7"/>
