<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="790" viewBox="0 0 1360 790" role="img" aria-label="Resilience test harness — recommended plug-in architecture">
<title>Resilience test harness — recommended plug-in architecture</title>
<style>
 text{font-family:'IBM Plex Sans','DejaVu Sans',Verdana,sans-serif;fill:#131b22}
 .h1{font-size:25px;font-weight:600} .sub{font-size:12.5px;fill:#5a6b78}
 .band{font-family:'IBM Plex Mono','DejaVu Sans Mono',monospace;font-size:10px;fill:#5a6b78;letter-spacing:1.3px}
 .ti{font-size:12.5px;font-weight:600}
 .tim{font-family:'IBM Plex Mono','DejaVu Sans Mono',monospace;font-size:10px;fill:#5a6b78}
 .bd{font-size:10.5px;fill:#5a6b78}
 .chip{font-size:11px;fill:#131b22}
 .base{font-size:11px;font-weight:600;fill:#131b22}
 .next{font-size:11px;fill:#5a6b78;font-style:italic}
 .lbl{font-size:10.5px;fill:#5a6b78}
</style>
<defs><marker id="am" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L5 4 L0 7z" fill="#5a6b78"/></marker></defs>
<rect x="0" y="0" width="1360" height="790" fill="#ffffff"/>

<text x="40" y="52" class="h1">Resilience test harness — recommended plug-in architecture</text>
<text x="40" y="76" class="sub">The orchestrator runs the same nine phases for every test. Fault-specific code is in subclasses at three extension points; adding a fault does not modify the orchestrator.</text>

<text x="40" y="126" class="band">INPUTS · WHAT AND WHERE</text>
<text x="320" y="126" class="band">CONTROL · ORCHESTRATOR</text>
<text x="640" y="126" class="band">EXTENSION POINTS · BASE CLASS → SUBCLASSES</text>

<!-- inputs -->
<rect x="40" y="140" width="240" height="214" rx="6" fill="#ffffff" stroke="#b9c8d0" stroke-width="1.4"/>
<rect x="52" y="172" width="216" height="44" rx="4" fill="#ffffff" stroke="#dbe3e8"/>
<text x="62" y="190" class="chip">catalog/NL/&lt;ID&gt;.yaml</text>
<text x="62" y="206" class="bd">fault · measures · pass criteria</text>
<rect x="52" y="224" width="216" height="44" rx="4" fill="#ffffff" stroke="#dbe3e8"/>
<text x="62" y="242" class="chip">envs/&lt;lab&gt;.yaml</text>
<text x="62" y="258" class="bd">hosts · drivers · time limits · alerting</text>
<rect x="52" y="276" width="216" height="44" rx="4" fill="#ffffff" stroke="#dbe3e8"/>
<text x="62" y="294" class="chip">catalog/schema.py</text>
<text x="62" y="310" class="bd">validates both · fault type → section</text>

<!-- control -->
<rect x="320" y="140" width="280" height="214" rx="6" fill="#fffaf0" stroke="#d9a13b" stroke-width="1.4"/>
<rect x="332" y="172" width="256" height="44" rx="4" fill="#ffffff" stroke="#dbe3e8"/>
<text x="342" y="190" class="base">TestOrchestrator</text>
<text x="342" y="206" class="bd">9 phases · calls hooks · no fault-type branches</text>
<rect x="332" y="224" width="256" height="26" rx="4" fill="#ffffff" stroke="#dbe3e8"/>
<text x="342" y="241" class="chip">safety controller · injection ledger · kill switch</text>
<rect x="332" y="258" width="256" height="44" rx="4" fill="#ffffff" stroke="#dbe3e8"/>
<text x="342" y="276" class="base">RunContext</text>
<text x="342" y="292" class="bd">interface between fault classes and the run</text>
<rect x="332" y="310" width="256" height="26" rx="4" fill="#eef8f0" stroke="#3f9a5a"/>
<text x="342" y="327" class="chip">phase time limit = profile limit + hold</text>

<!-- A: behaviours -->
<rect x="640" y="140" width="680" height="166" rx="6" fill="#ffffff" stroke="#b9c8d0" stroke-width="1.4"/>
<text x="656" y="160" class="ti">FAULT BEHAVIOURS</text>
<text x="818" y="160" class="tim">control/faults/ · fault-specific steps and measures · @register_fault</text>
<rect x="656" y="172" width="170" height="26" rx="4" fill="#f4f7f9" stroke="#9aa9b3"/>
<text x="666" y="189" class="base">FaultBehaviour</text>
<rect x="840" y="172" width="196" height="26" rx="4" fill="#ffffff" stroke="#dbe3e8"/>
<text x="850" y="189" class="chip">ProcessKill · Restart · Reload</text>
<rect x="1046" y="172" width="134" height="26" rx="4" fill="#ffffff" stroke="#dbe3e8"/>
<text x="1056" y="189" class="chip">ConnectionExhaustion</text>
<rect x="1190" y="172" width="130" height="26" rx="4" fill="#ffffff" stroke="#dbe3e8"/>
<text x="1200" y="189" class="chip">IdleTransaction</text>
<rect x="840" y="204" width="120" height="26" rx="4" fill="#ffffff" stroke="#dbe3e8"/>
<text x="850" y="221" class="chip">DataCorruption</text>
<rect x="970" y="204" width="200" height="26" rx="4" fill="#ffffff" stroke="#dbe3e8"/>
<text x="980" y="221" class="chip">PowerRestored ▸ HostPowerLoss</text>
<rect x="1180" y="204" width="140" height="26" rx="4" fill="#eef8f0" stroke="#3f9a5a"/>
<text x="1190" y="221" class="chip">HeldFault (new base)</text>
<rect x="656" y="236" width="170" height="26" rx="4" fill="#f4f7f9" stroke="#9aa9b3"/>
<text x="666" y="253" class="base">DuringBehaviour</text>
<rect x="840" y="236" width="90" height="26" rx="4" fill="#ffffff" stroke="#dbe3e8"/>
<text x="850" y="253" class="chip">Checkpoint</text>
<rect x="940" y="236" width="124" height="26" rx="4" fill="#ffffff" stroke="#dbe3e8"/>
<text x="950" y="253" class="chip">LargeTransaction</text>
<rect x="1074" y="236" width="150" height="26" rx="4" fill="#ffffff" stroke="#dbe3e8"/>
<text x="1084" y="253" class="chip">ConcurrentIndexBuild</text>
<rect x="840" y="268" width="130" height="26" rx="4" fill="#ffffff" stroke="#dbe3e8"/>
<text x="850" y="285" class="chip">AutovacuumWorker</text>
<rect x="980" y="268" width="240" height="26" rx="4" fill="#ffffff" stroke="#9aa9b3" stroke-dasharray="4 3"/>
<text x="990" y="285" class="next">NL-N behaviours on HeldFault (next)</text>

<!-- B: drivers -->
<rect x="640" y="322" width="680" height="102" rx="6" fill="#ffffff" stroke="#b9c8d0" stroke-width="1.4"/>
<text x="656" y="342" class="ti">FAULT DRIVERS</text>
<text x="788" y="342" class="tim">execution/injectors/ · apply and remove the fault · register(section, cls)</text>
<rect x="656" y="354" width="170" height="26" rx="4" fill="#f4f7f9" stroke="#9aa9b3"/>
<text x="666" y="371" class="base">FaultInjector</text>
<rect x="840" y="354" width="170" height="26" rx="4" fill="#ffffff" stroke="#dbe3e8"/>
<text x="850" y="371" class="chip">OsSshProcessDriver</text>
<rect x="1020" y="354" width="160" height="26" rx="4" fill="#ffffff" stroke="#dbe3e8"/>
<text x="1030" y="371" class="chip">OsSshCorruptionDriver</text>
<rect x="1190" y="354" width="130" height="26" rx="4" fill="#ffffff" stroke="#dbe3e8"/>
<text x="1200" y="371" class="chip">LibvirtPowerDriver</text>
<rect x="840" y="386" width="170" height="26" rx="4" fill="#ffffff" stroke="#dbe3e8"/>
<text x="850" y="403" class="bd">one strategy class per fault</text>
<rect x="1020" y="386" width="160" height="26" rx="4" fill="#ffffff" stroke="#9aa9b3" stroke-dasharray="4 3"/>
<text x="1030" y="403" class="next">resource_limit · cgroup</text>
<rect x="1190" y="386" width="130" height="26" rx="4" fill="#ffffff" stroke="#9aa9b3" stroke-dasharray="4 3"/>
<text x="1200" y="403" class="next">co-tenant VM driver</text>

<!-- C: adapter -->
<rect x="640" y="440" width="680" height="102" rx="6" fill="#ffffff" stroke="#b9c8d0" stroke-width="1.4"/>
<text x="656" y="460" class="ti">DATABASE ADAPTER</text>
<text x="822" y="460" class="tim">adapters/ · database access · the only PostgreSQL-specific code</text>
<rect x="656" y="472" width="170" height="26" rx="4" fill="#f4f7f9" stroke="#9aa9b3"/>
<text x="666" y="489" class="base">BaseDatabaseAdapter</text>
<rect x="840" y="472" width="170" height="26" rx="4" fill="#ffffff" stroke="#dbe3e8"/>
<text x="850" y="489" class="chip">PostgreSQLAdapter (core)</text>
<rect x="1020" y="472" width="300" height="26" rx="4" fill="#ffffff" stroke="#dbe3e8"/>
<text x="1030" y="489" class="chip">+ corruption · operations · sessions mixins</text>
<rect x="840" y="504" width="170" height="26" rx="4" fill="#ffffff" stroke="#9aa9b3" stroke-dasharray="4 3"/>
<text x="850" y="521" class="next">DistDB adapter (Tier 3)</text>
<rect x="1020" y="504" width="300" height="26" rx="4" fill="#ffffff" stroke="#9aa9b3" stroke-dasharray="4 3"/>
<text x="1030" y="521" class="next">several nodes per run: standby, co-tenant host</text>

<!-- arrows from the orchestrator -->
<line x1="280" y1="194" x2="318" y2="194" stroke="#5a6b78" stroke-width="1.3" marker-end="url(#am)"/>
<line x1="600" y1="194" x2="638" y2="194" stroke="#5a6b78" stroke-width="1.3" marker-end="url(#am)"/>
<text x="603" y="186" class="lbl">hooks</text>
<polyline points="600,330 620,330 620,367 638,367" fill="none" stroke="#5a6b78" stroke-width="1.3" marker-end="url(#am)"/>
<text x="546" y="390" class="lbl">resolve(fault)</text>
<polyline points="470,354 470,485 638,485" fill="none" stroke="#5a6b78" stroke-width="1.3" marker-end="url(#am)"/>
<text x="480" y="478" class="lbl">adapter calls</text>
<line x1="380" y1="354" x2="380" y2="596" stroke="#5a6b78" stroke-width="1.3" marker-end="url(#am)"/>
<text x="388" y="580" class="lbl">events · measures</text>

<!-- analysis and observability -->
<text x="40" y="590" class="band"></text>
<rect x="40" y="600" width="1280" height="104" rx="6" fill="#ffffff" stroke="#b9c8d0" stroke-width="1.4"/>
<text x="56" y="620" class="ti">ANALYSIS &amp; OBSERVABILITY</text>
<text x="282" y="620" class="tim">evidence → measures → verdict · a value that cannot be measured is NOT_MEASURED and fails</text>
<rect x="56" y="632" width="200" height="26" rx="4" fill="#ffffff" stroke="#dbe3e8"/>
<text x="66" y="649" class="chip">event stream · events.jsonl</text>
<rect x="266" y="632" width="200" height="26" rx="4" fill="#eef8f0" stroke="#3f9a5a"/>
<text x="276" y="649" class="chip">probes + fault samplers()</text>
<rect x="476" y="632" width="200" height="26" rx="4" fill="#ffffff" stroke="#dbe3e8"/>
<text x="486" y="649" class="chip">rto_decomposer (RTO, SLO)</text>
<rect x="686" y="632" width="200" height="26" rx="4" fill="#eef8f0" stroke="#3f9a5a"/>
<text x="696" y="649" class="chip">degradation (TPS, p99 ratios)</text>
<rect x="896" y="632" width="200" height="26" rx="4" fill="#ffffff" stroke="#dbe3e8"/>
<text x="906" y="649" class="chip">predicates · verdict</text>
<rect x="1106" y="632" width="200" height="26" rx="4" fill="#eef8f0" stroke="#3f9a5a"/>
<text x="1116" y="649" class="chip">alerts (source: none yet)</text>
<rect x="56" y="666" width="410" height="26" rx="4" fill="#ffffff" stroke="#9aa9b3" stroke-dasharray="4 3"/>
<text x="66" y="683" class="next">cluster-only accept rules, e.g. leader_changed (needs a team decision)</text>
<rect x="476" y="666" width="410" height="26" rx="4" fill="#ffffff" stroke="#9aa9b3" stroke-dasharray="4 3"/>
<text x="486" y="683" class="next">a real alert source the harness can read (needs infra)</text>

<!-- legend -->
<rect x="40" y="732" width="26" height="16" rx="3" fill="#f4f7f9" stroke="#9aa9b3"/>
<text x="74" y="745" class="lbl">base class (abstract contract)</text>
<rect x="260" y="732" width="26" height="16" rx="3" fill="#ffffff" stroke="#dbe3e8"/>
<text x="294" y="745" class="lbl">built subclass / component</text>
<rect x="470" y="732" width="26" height="16" rx="3" fill="#eef8f0" stroke="#3f9a5a"/>
<text x="504" y="745" class="lbl">added in this code improvement</text>
<rect x="700" y="732" width="26" height="16" rx="3" fill="#ffffff" stroke="#9aa9b3" stroke-dasharray="4 3"/>
<text x="734" y="745" class="lbl">recommended next</text>
<text x="40" y="772" class="bd">A new fault = a scenario YAML + a driver subclass + (if the run differs) a behaviour subclass + a registration line. The orchestrator is not edited.</text>
</svg>
