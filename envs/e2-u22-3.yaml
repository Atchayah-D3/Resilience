# Environment profile (Arch §3.1): the Rocky Linux 9 lab target BDB-QA-U22-3.
# Everything environment-specific lives here: hosts, ports, paths, services, drivers,
# phase bounds and safety fingerprints. Scenarios in catalog/ stay environment-agnostic.
#
# Target set up on 10 November 2026 (infra/vm-setup.md, adapted to Rocky Linux 9):
#   ShaktiDB 17.11.1.0 from shaktidb_17.11.1.0_el9_1_x86_64.rpm, binaries in /usr/pgsql-17.11.1.0/bin
#   own cluster in /var/lib/resilience/pgdata, page checksums on, port 5434 (5433 is another cluster)
#   service shaktidb-resilience.service, enabled, Restart=on-failure
#   one disk (vda); pg_test_fsync fdatasync about 1,850 per second (0.53 ms) on 10 November
# Driver host: BDB-QA-U22-2 (10.11.21.13).
name: e2-u22-3
class: E2
environment: lab

database:
  engine: postgresql             # adapter that serves this environment (Arch §8)

storage_class: null              # declared once the storage backend is qualified (Framework §3.4)

os_ssh:
  driver: os_ssh                 # process, systemd and filesystem faults over SSH (Arch §5)

noisy_neighbour:
  injectable: false
  driver: null

storage_fault:
  dm_shim: false                 # set true when PGDATA sits behind a dm-flakey shim (Arch §3)

reset:
  driver: none                   # snapshot reset driver, when the environment provides one

sla_tier_target: platinum

driver_host:                     # workload driver and marker journals, separate from the target (Arch §6.2)
  host: 10.11.21.13
  run_dir: /home/ldap/sivasankari/resilience-runs

nodes:
  - name: shaktidb-standalone
    role: standalone
    topology_role: primary
    ssh: {host: 10.11.21.14, port: 5015, user: sivasankari}
    db: {host: 10.11.21.14, port: 5434, dbname: resilience, user: harness}
    client: {host: 10.11.21.14, port: 5434, dbname: resilience, user: harness}
    pgdata: /var/lib/resilience/pgdata
    pg_bin: /usr/pgsql-17.11.1.0/bin
    os_user: postgres
    service: shaktidb-resilience.service
    log_file: /var/lib/resilience/pgdata/logfile

safety:                          # Arch §15: default deny, plus an operator-created sentinel
  allowlist:
    hostname_pattern: '^BDB-QA-U22-3$'
    inventory_tag: resilience-lab-e2-u22-3
  sentinel_table: resilience.harness_target
  max_data_fs_used_pct: 90        # standing abort: stop before the data filesystem fills (operator-owned margin)

phase_timeouts_s:                # every phase is bounded; an unbounded wait is a defect (Arch §15)
  reset: 600
  init: 180
  baseline: 300
  pre_fault: 300
  fault_inject: 120
  recovery: 120
  validate: 1800
  report: 120
  cleanup: 600

disclosures:                     # stated in every report produced against this environment
  - "Baseline reset is not configured here: the target is not rolled back to a snapshot before a run."
  - "Storage class is not declared: results certify no storage class."
  - "Other software runs on the target VM and shares its CPU and disk: a MailHog container and a ShaktiDB 18.6.3.0 cluster on port 5433 (/var/lib/pgsql/data-replica1); neither was stopped."
  - "Local connections to the test cluster use trust authentication (pg_hba.conf 'local all all trust'); network access for the harness role uses scram-sha-256 from the driver host only."
