# NL-M-05 -- Idle-in-transaction blocking vacuum (Framework §10.7, Tier 1, P1).
# Fault injection: An idle transaction held for 2 h under write load.
# Acceptance: idle_in_transaction_session_timeout enforced, or a bloat alert fires.
#
# An open transaction holding an assigned transaction id pins the vacuum horizon, so vacuum
# cannot remove dead row versions that concurrent churn traffic creates. The Framework accepts
# either of two defences, and the harness accepts a path only on evidence it can observe:
#
# Path A -- idle_in_transaction_session_timeout_enforced. The server must have ended THIS
#   session BECAUSE of the timeout: the backend is gone, the harness's own connection is
#   closed, AND the cause is evidenced -- the server's log line "terminating connection due to
#   idle-in-transaction timeout", or SQLSTATE 25P03 on the closed connection. A session that
#   merely vanished is NOT_MEASURED, not a pass.
#
# Path B -- vacuum_blocked AND bloat_alert_fired. vacuum_blocked is proven directly: with the
#   idle session still open, VACUUM (VERBOSE) on the churn table must report dead tuples it
#   could not remove, at a removable cutoff no newer than the idle session's transaction id.
#   bloat_alert_fired means an alert from the deployment's MONITORING. The harness has no
#   alert source wired in yet, so it reports this as NOT_MEASURED -- its own dead-tuple ratio
#   is evidence that bloat exists, not that anything alerted on it. Until an alert source is
#   connected, path B cannot pass and only a configured timeout can satisfy this scenario.
#
# The fault itself is verified at injection: the session must be seen in pg_stat_activity as
# `idle in transaction` holding a transaction id, or the run aborts -- nothing is scored
# against a fault that did not land.
#
# Hold time: the Framework specifies 2 h. The harness holds for the configured timeout plus a
# 2 s grace (when that fits the recovery bound), otherwise for 30 s -- enough to produce dead
# tuples for the vacuum probe under 200 TPS of churn. The shortfall against 2 h is stated as a
# disclosure on every run.
#
# All acknowledged writes must survive (rpo_txn == 0) and the relations must stay intact.
id: NL-M-05
name: Idle-in-transaction blocking vacuum
tier: node_local
category: NL-M
applies_to: [standalone, distdb.pc, distdb.qc, distdb.worker]

environment:
  classes: [E1, E2, E3, E4]
  env_sensitive: false           # Framework §7.3: NL-M is PostgreSQL-internal behaviour

steady_state:
  tps_min: 150
  p99_latency_ms_max: 300
  duration_s: 120

workload:
  profile: mixed                 # markers (append-only) PLUS update/delete churn to generate dead tuples
  concurrency: 64
  transaction_markers: true
  rate_tps: 200

fault:
  type: idle_in_transaction
  driver: os_ssh                 # env-profile section; the profile picks the driver
  target: primary
  duration: permanent

blast_radius:
  max_nodes_affected: 1
  environments: [lab, staging]

abort_if:
  - replication_lag_s > 300
  - secondary_node_unhealthy

requires:                        # engine capabilities this scenario needs (Arch §8)
  - transactional_markers
  - workload_churn               # without churn, no dead tuples are generated to block
  - structural_integrity_check

measure:
  - idle_in_transaction_session_timeout_enforced  # Framework §10.7, path A
  - vacuum_blocked                                # path B: VACUUM could not remove dead tuples
  - bloat_alert_fired                             # Framework §10.7, path B: from monitoring
  - dead_tuples_not_removable                     # reported: from the VACUUM (VERBOSE) probe
  - oldest_transaction_age_s
  - dead_tuple_ratio                              # reported: planner statistics, may be stale
  - unvacuumed_dead_tuples
  - tuple_bloat_ratio                             # reported: (live + dead) / live tuples
  - rpo_txn
  - indeterminate_txn
  - structural_integrity_errors
  - corruption_count

accept:
  - idle_in_transaction_session_timeout_enforced == true or (vacuum_blocked == true and bloat_alert_fired == true)
  - rpo_txn == 0
  - structural_integrity_errors == 0
  - corruption_count == 0

priority: P1

description: >
  An idle transaction with an open snapshot is held on the primary node under write load,
  pinning the vacuum xmin horizon. Autovacuum is blocked from reclaiming dead tuples generated
  by concurrent churn traffic. Either the server enforces idle_in_transaction_session_timeout
  to terminate the session and advance the horizon, or an operational bloat alert fires as
  dead tuples accumulate (Framework §10.7). Crash recovery and storage stack durability are
  covered by categories NL-C and NL-D.
