# NL-C-04 -- Recovery time versus WAL volume (Framework §10.2, Tier 1, P0).
# Fault injection: crash at 1 / 4 / 16 GB of un-checkpointed WAL. Acceptance: recovery_s <= the
# RTO budget at the maximum WAL volume permitted by max_wal_size; the relationship is linear
# and predictable, so the worst case is computable from configuration.
#
# BLOCKED BY INFRASTRUCTURE (needs_infra). Holding 16 GB of un-checkpointed WAL needs pg_wal on
# its own volume of at least 30 GB (docs/infra-requirements.md, Request 1); on the current
# target pg_wal shares the root filesystem, and filling it would take the host down. The run
# plan skips this scenario with that reason, and the orchestrator refuses it, until a profile
# declares `infra: [dedicated_wal_volume]`.
#
# NOT YET BUILT, and required before the block is lifted: the WAL-volume control (raise
# max_wal_size and checkpoint_timeout, then kill once the redo distance reaches each of 1, 4
# and 16 GB), the per-point recovery measurement, the linear fit, and the RTO budget derived
# from max_wal_size. The accept list below is a placeholder that stays honest meanwhile: the
# Platinum RTO of NL-C-01, which the profile's sla_tier_target names -- the earlier 120 s had
# no source. A single kill at an uncontrolled WAL volume is NL-C-01, not this scenario.
#
# Durability of the underlying storage stack is covered by category NL-D (Framework §13.1).
id: NL-C-04
name: Recovery time versus WAL volume
tier: node_local
category: NL-C
applies_to: [standalone, distdb.pc, distdb.qc, distdb.worker]

environment:
  classes: [E1, E2, E3, E4]
  env_sensitive: false           # Framework §7.3: NL-C is PostgreSQL-internal behaviour

steady_state:
  tps_min: 150                   # floor, not a throughput target
  p99_latency_ms_max: 300
  duration_s: 120

workload:
  profile: oltp_write_heavy
  concurrency: 64
  transaction_markers: true
  rate_tps: 500

fault:
  type: process_kill
  driver: os_ssh                 # env-profile section; the profile picks the driver
  target: primary
  duration: permanent

blast_radius:
  max_nodes_affected: 1
  environments: [lab, staging]

abort_if:
  - replication_lag_s > 300
  - secondary_node_unhealthy

requires:                        # engine capabilities this scenario needs (Arch §8)
  - transactional_markers
  - structural_integrity_check

needs_infra:                     # docs/infra-requirements.md, Request 1
  - dedicated_wal_volume

measure:
  - rpo_txn
  - indeterminate_txn
  - rto_first_write_s
  - rto_to_slo_s
  - corruption_count
  - structural_integrity_errors  # engine-neutral name; 'amcheck_errors' is the same value
  - starts_unattended

accept:
  - rpo_txn == 0
  - rto_first_write_s <= 60       # placeholder: Platinum RTO, as NL-C-01 (see header)
  - corruption_count == 0
  - structural_integrity_errors == 0
  - starts_unattended == true

priority: P0

description: >
  The primary is killed at 1, 4 and 16 GB of un-checkpointed WAL. Recovery time must scale
  linearly with the WAL replayed and stay within the RTO budget at the largest volume
  max_wal_size permits. Blocked until a dedicated pg_wal volume is provisioned. Durability of
  the storage stack is covered by category NL-D (Framework §13.1).

see_also: [NL-C-01, NL-C-05]
