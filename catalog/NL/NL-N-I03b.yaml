# NL-N-I03b -- Lock pile-up behind a schema change, run 3b: no lock timeout (finding) (internal NL-N scenario; not a row of
# Framework §10.6, which lists 8 NL-N rows and no lock pile-up).
#
# A schema change needs the strongest lock on its table. While it waits for that lock -- or holds
# it while it rewrites the table -- every new query on the table queues behind it. The workload
# is the TPC-C-like workload (Scenario 3 document, section 1) and the table is TPC-C's stock:
# New-Order and Stock-Level use it (the table users); Payment, Order-Status and Delivery do not
# (the others). Latency is timed from when each transaction should have started, after a 5-minute
# unmeasured warm-up and a 2-minute baseline. The TPC-C data must be loaded on the target first
# (python -m resilience_tests.execution.workload.tpcc.load --warehouses N, N = workload.tpcc.warehouses).
#
# Run 3b: as run 3a but the schema change has NO lock timeout, so the freeze lasts as long as the
# blocker does -- here until fault.duration ends and the harness commits the read (the schema
# change arrives at minute 1, the read ends at minute 2: a ~60 s freeze). A finding: how long the
# table users wait, what the others lose through the shared connections, and whether the write
# prober stalls -- reported, not judged. Gated (Scenario 3 document, run 3b): the fault landed,
# the schema change completed once the read ended, check 7 (probe_column_absent, no harness
# session left) and check 8 (rpo_txn, corruption_count, structural_integrity_errors -- Framework
# §16.3 -- and TPC-C's partial_commits and consistency rules), plus the settings cleanup check
# (document 2.3) -- NEEDS SIGN-OFF.
#
# Every setting is a SESSION setting on the pile-up's own two sessions (tagged by
# application_name); the server's configuration is never written. Cleanup and the kill switch
# end the tagged sessions and drop the probe column the schema change added.
id: NL-N-I03b
name: Lock pile-up behind a schema change -- no lock timeout
tier: node_local
category: NL-N
applies_to: [standalone]

environment:
  classes: [E1, E2, E3, E4]
  env_sensitive: false

steady_state:
  tps_min: 45
  p99_latency_ms_max: 3000
  duration_s: 120                # the document: 2 minutes of undisturbed baseline
  warmup_s: 300                  # the document (table 0): 5 minutes of warm-up, not measured

workload:
  profile: tpcc                  # the document: TPC-C-like workload, New-Order ... Stock-Level
  concurrency: 64
  transaction_markers: true
  rate_tps: 60                  # NEEDS SIGN-OFF: the document asks ~60% of the target's measured
                                 # maximum (tpcc.capacity); set it from that result
  latency_from: intended_start   # the document: latency from when the transaction should have started
  tpcc:
    warehouses: 64              # must equal the loaded data (standard size: 5 per clerk)

fault:
  type: lock_pileup
  driver: os_ssh
  target: primary
  duration: 120.0                # the read is held this long, so the freeze lasts ~60 s
  lock_pileup:
    blocker: long_read
    ddl: add_column
    ddl_lock_timeout_s: 0        # none: the schema change waits for ever
    ddl_after_s: 60.0              # the document: the schema change arrives at minute 1
    table: tpcc_stock              # the document: ALTER TABLE stock ADD COLUMN ...

blast_radius:
  max_nodes_affected: 1
  environments: [lab, staging]

abort_if:
  - replication_lag_s > 300
  - secondary_node_unhealthy

requires:
  - transactional_markers
  - structural_integrity_check
  - tpcc_workload

measure:
  - rpo_txn
  - indeterminate_txn
  - rto_first_write_s
  - rto_to_slo_s
  - corruption_count
  - structural_integrity_errors
  - starts_unattended
  - fault_confirmed
  - oltp_tps_ratio
  - oltp_p99_ratio
  - ddl_lock_timeout_fired
  - ddl_completed
  - queue_freeze_s
  - queue_max_sessions
  - blocker_visible
  - longest_table_wait_s
  - other_tables_tps_lost_pct
  - writer_max_stall_s
  - server_crash_restarts
  - lock_waits_logged            # reported: the server's lock-wait log lines (log_lock_waits on)
  - probe_column_absent          # document check 7 / table 20: the probe column is gone after the run
  - harness_sessions_left        # document table 20: no harness session left on the server
  - settings_unchanged           # document 2.3 cleanup check: settings equal what was recorded
  - partial_commits              # TPC-C: transactions only partly kept (atomicity)
  - tpcc_consistency_violations  # TPC-C consistency rules after the fault
  - aborted_markers_present      # reported: rolled-back transactions whose marker was kept

accept:
  - fault_confirmed == true
  - ddl_completed == true        # the document: the schema change completes once the read ends
  - rpo_txn == 0
  - corruption_count == 0
  - structural_integrity_errors == 0
  - partial_commits == 0              # document check 8: no damaged data (TPC-C atomicity)
  - tpcc_consistency_violations == 0  # document check 8: no damaged data (TPC-C consistency rules)
  - probe_column_absent == true       # document check 7
  - harness_sessions_left == 0        # document table 20
  - settings_unchanged == true        # document 2.3 cleanup check

priority: P0                     # Scenario 3 document: impact 4

description: >
  A long read holds the contended table and a schema change with no lock timeout queues behind it,
  so every table user waits until the read ends. Reported as a finding: the freeze, the longest
  wait, the throughput the other work lost and any write stall. Internal scenario of category NL-N
  (Framework §10.6).
