# NL-I-02 -- Index corruption (Framework §10.4, Tier 1, P0).
# Fault injection: corrupt a btree file.
# Acceptance: amcheck detects it; REINDEX restores; no wrong results returned first.
#
# The same precise fault as NL-I-01 (Arch §5 "targeted byte writes"), aimed at a btree index
# (fault.relation_kind): one byte in one LEAF page of an index the harness builds on its own
# table is inverted with the database cleanly shut down. The byte is not chosen blind: with the
# database down, the page's own bytes must show it is a leaf page, and its line pointers locate
# a real data entry in it; the byte flipped is the low byte of that entry's heap row pointer
# (its offset number). An engine that served the page without verifying it would therefore
# return a missing or a different row -- a wrong result the read can see. After the write,
# pg_checksums must report a checksum failure at exactly that block of the index file
# (Arch §10.1). Otherwise the run is aborted -- nothing is scored against a fault that did not
# land. data_checksums=on is required (Framework §16.2).
#
# What each acceptance rule proves, and why it is needed against a false pass:
#   wrong_results_returned        reads THROUGH THE INDEX (plan checked) either failed with the
#                                 data-corruption error or returned exactly the rows written. A
#                                 read the planner served without the index cannot pass this:
#                                 it is NOT_MEASURED, never 0 ("no wrong results returned first").
#   detection_identifies_block    the first read through the index failed with the data-corruption
#                                 error naming exactly the damaged block of the index file. Without
#                                 it, a read that walked the damaged page and returned the right
#                                 rows would pass "no wrong results" while the engine read a
#                                 corrupted page unnoticed -- the silent corruption that checksums
#                                 exist to prevent (Framework §16.2). The Framework row does not
#                                 name this rule: NEEDS SIGN-OFF.
#   amcheck_detects_target        the structural checker, run on the damaged index alone, reports
#                                 it ("amcheck detects it", Arch §10.1).
#   reindex_restores              REINDEX succeeded, a read through the rebuilt index returns
#                                 exactly the rows written, AND pg_amcheck --heapallindexed on the
#                                 table and its index is clean ("REINDEX restores").
#   corruption_outside_target     no other relation appears in the engine's own failure reports.
#   structural_integrity_errors   pg_amcheck over the rest of the database is clean (§16.3); the
#                                 corruption table and its index are checked on their own instead.
#   rpo_txn                       the fault's clean stop and start lost no acknowledged commit.
#
# Reported, not gated (the Framework row does not ask for them): corruption_detected_on_read
# (implied by detection_identifies_block), detection_repeatable, checksum_failure_reported,
# reindex_duration_s, and corruption_count (it includes the failures caused on purpose).
# The Framework gives no steady-state or workload numbers for this row; the values below match
# NL-I-01. NEEDS SIGN-OFF.
id: NL-I-02
name: Index corruption
tier: node_local
category: NL-I
applies_to: [standalone, distdb.pc, distdb.qc, distdb.worker]

environment:
  classes: [E1, E2, E3, E4]
  env_sensitive: false           # Framework §7.3: NL-I is PostgreSQL-internal behaviour

steady_state:
  tps_min: 150
  p99_latency_ms_max: 300
  duration_s: 120

workload:
  profile: oltp_write_heavy
  concurrency: 64
  transaction_markers: true      # RPO across the fault's clean stop and start
  rate_tps: 200

fault:
  type: data_corruption
  driver: os_ssh                 # env-profile section; the profile picks the driver
  target: primary
  duration: permanent
  relation_kind: btree_index     # a leaf page of a harness-owned btree index

blast_radius:
  max_nodes_affected: 1
  environments: [lab, staging]

abort_if:
  - replication_lag_s > 300
  - secondary_node_unhealthy

requires:                        # engine capabilities this scenario needs (Arch §8)
  - transactional_markers
  - structural_integrity_check
  - page_checksums

measure:
  - wrong_results_returned
  - amcheck_detects_target
  - reindex_restores
  - reindex_duration_s           # reported
  - corruption_detected_on_read  # reported
  - detection_identifies_block   # gated: the read reached the damaged page and refused it
  - detection_repeatable         # reported
  - checksum_failure_reported    # reported
  - corruption_outside_target
  - structural_integrity_errors  # every relation except the corruption table and its index
  - corruption_count             # reported only: includes the failures caused on purpose
  - rpo_txn
  - indeterminate_txn

accept:
  - wrong_results_returned == 0
  - detection_identifies_block == true   # Framework §16.2; NEEDS SIGN-OFF (not in the row)
  - amcheck_detects_target == true
  - reindex_restores == true
  - corruption_outside_target == 0
  - structural_integrity_errors == 0
  - rpo_txn == 0

priority: P0

see_also: [NL-I-01]

description: >
  One byte -- the heap row pointer of a data entry -- in one leaf page of a harness-owned btree
  index is corrupted with the database cleanly shut down, the corruption is confirmed by
  offline checksum verification at exactly that block, and the database is started again.
  Reads through the index must fail at that block rather than return wrong rows, the
  structural checker must report the index damaged, and REINDEX must
  restore it -- proven by a correct read through the rebuilt index and a clean heap-to-index
  check -- with nothing else damaged (Framework §10.4, Arch §10.1).
