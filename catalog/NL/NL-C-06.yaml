# NL-C-06 -- Crash during CREATE INDEX CONCURRENTLY (Framework §10.2, Tier 1, P1).
# Fault injection: kill -9 mid-build. Acceptance: index left INVALID, table readable,
# rebuild succeeds.
#
# The index is built on its own seeded table (created in init, before the baseline), never on
# a table other scenarios write to. The kill is sent only once the engine's own progress view
# reports the build past initialisation (fault.during). After recovery the index must exist
# and be INVALID -- an index found VALID means the build finished before the kill, and the
# scenario fails rather than passing on a kill that missed. Then the table must be readable,
# and PostgreSQL's documented recovery (drop the invalid index, build it again concurrently)
# must succeed. Cleanup drops the index, so the next run starts from no index at all.
#
# The Framework gives no steady-state or workload numbers for this row; the values match
# NL-C-01. NEEDS SIGN-OFF.
#
# Durability of the underlying storage stack is covered by category NL-D (Framework §13.1).
id: NL-C-06
name: Crash during CREATE INDEX CONCURRENTLY
tier: node_local
category: NL-C
applies_to: [standalone, distdb.pc, distdb.qc, distdb.worker]

environment:
  classes: [E1, E2, E3, E4]
  env_sensitive: false           # Framework §7.3: NL-C is PostgreSQL-internal behaviour

steady_state:
  tps_min: 150                   # floor, not a throughput target
  p99_latency_ms_max: 300
  duration_s: 120

workload:
  profile: oltp_write_heavy
  concurrency: 64
  transaction_markers: true
  rate_tps: 200

fault:
  type: process_kill
  driver: os_ssh                 # env-profile section; the profile picks the driver
  target: primary
  duration: permanent
  during: concurrent_index_build  # the state the kill must land inside


blast_radius:
  max_nodes_affected: 1
  environments: [lab, staging]

abort_if:
  - replication_lag_s > 300
  - secondary_node_unhealthy

requires:                        # engine capabilities this scenario needs (Arch §8)
  - transactional_markers
  - structural_integrity_check

measure:
  - rpo_txn
  - indeterminate_txn
  - rto_first_write_s
  - rto_to_slo_s
  - corruption_count
  - structural_integrity_errors  # engine-neutral name; 'amcheck_errors' is the same value
  - starts_unattended
  - operation_in_progress_at_fault  # the build was confirmed running at the kill
  - index_left_invalid              # the interrupted index exists and is marked INVALID
  - table_readable                  # the indexed table can still be read in full
  - rebuild_succeeds                # drop + CREATE INDEX CONCURRENTLY yields a VALID index

accept:
  - operation_in_progress_at_fault == true
  - index_left_invalid == true      # Framework §10.2: index left INVALID
  - table_readable == true          # Framework §10.2: table readable
  - rebuild_succeeds == true        # Framework §10.2: rebuild succeeds
  - starts_unattended == true
  - rpo_txn == 0
  - corruption_count == 0
  - structural_integrity_errors == 0 # Framework §16.3: pg_amcheck clean after every scenario

priority: P1

description: >
  The primary is killed with SIGKILL while a CREATE INDEX CONCURRENTLY is confirmed in
  progress under marker-instrumented load. After crash recovery the interrupted index must be
  left INVALID, the table must remain readable, and dropping and rebuilding the index must
  succeed. Durability of the storage stack is covered by category NL-D (Framework §13.1).

see_also: [NL-C-01]
