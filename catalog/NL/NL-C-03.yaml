# NL-C-03 -- Crash during a large transaction (Framework §10.2, Tier 1, P0).
# Fault injection: kill -9 during a large multi-row bulk INSERT under load.
# Acceptance: rpo_txn == 0; corruption_count == 0; structural_integrity_errors == 0; starts_unattended == true.
#
# A massive transaction is interrupted mid-flight by SIGKILL. The uncommitted transaction must
# be completely rolled back by crash recovery: zero partial rows, foreign key invariants hold,
# and no structural integrity anomalies remain (Arch §5).
#
# Durability of the underlying storage stack is covered by category NL-D (Framework §13.1).
id: NL-C-03
name: Crash during a large transaction
tier: node_local
category: NL-C
applies_to: [standalone, distdb.pc, distdb.qc, distdb.worker]

environment:
  classes: [E1, E2, E3, E4]
  env_sensitive: false           # Framework §7.3: NL-C is PostgreSQL-internal behaviour

steady_state:
  tps_min: 150                   # floor, not a throughput target
  p99_latency_ms_max: 300
  duration_s: 120

workload:
  profile: oltp_write_heavy
  concurrency: 64
  transaction_markers: true
  rate_tps: 200

fault:
  type: process_kill
  driver: os_ssh                 # env-profile section; the profile picks the driver
  target: primary
  duration: permanent

blast_radius:
  max_nodes_affected: 1
  environments: [lab, staging]

abort_if:
  - replication_lag_s > 300
  - secondary_node_unhealthy

requires:                        # engine capabilities this scenario needs (Arch §8)
  - transactional_markers
  - structural_integrity_check

measure:
  - rpo_txn
  - indeterminate_txn
  - rto_first_write_s
  - rto_to_slo_s
  - corruption_count
  - structural_integrity_errors  # engine-neutral name; 'amcheck_errors' is the same value
  - starts_unattended

accept:
  - rpo_txn == 0
  - corruption_count == 0
  - structural_integrity_errors == 0
  - starts_unattended == true

priority: P0

description: >
  The primary database process is killed with SIGKILL during execution of a large multi-row
  transaction. Upon crash recovery, the interrupted transaction must be cleanly and fully
  rolled back, with zero partial rows, no orphaned tuple versions, and no structural
  integrity violations. Durability of the storage stack is covered by category NL-D (Framework §13.1).
